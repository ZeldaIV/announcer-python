[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "announcer-sdk"
version = "0.1.0"
description = "Python SDK for Announcer — send transactional email from your own domain, DKIM-signed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Trond Bordewich" }]
keywords = ["announcer", "email", "transactional-email", "smtp", "dkim", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.urls]
Homepage = "https://misralo.com"
Repository = "https://github.com/ZeldaIV/announcer-python"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "mypy>=1.8", "ruff==0.16.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/announcer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src/announcer"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
